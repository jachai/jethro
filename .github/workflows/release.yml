name: release

# Tags are per plugin: `claude plugin tag plugins/<name> --push` creates <name>--v<version>.
on:
  push:
    tags: ["*--v*"]

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.split.outputs.name }}
    steps:
      - id: split
        run: echo "name=${GITHUB_REF_NAME%--v*}" >> "$GITHUB_OUTPUT"

  test:
    needs: plugin
    uses: ./.github/workflows/test.yml
    with:
      plugin: ${{ needs.plugin.outputs.name }}

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: tag matches the plugin and script versions
        run: python3 .github/scripts/ci.py release-check "$GITHUB_REF_NAME"
      - name: release notes from the plugin's changelog
        run: python3 .github/scripts/ci.py notes "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
