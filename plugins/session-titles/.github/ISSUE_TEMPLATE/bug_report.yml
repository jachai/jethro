name: Bug report
description: A title came out wrong, didn't change, or something else broke
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste real prompts, transcripts, session names or paths. Redact them first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a wrong title, give the title you got and the kind of title you expected.
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: "`claude --version`"
    validations:
      required: true
  - type: input
    id: titles-version
    attributes:
      label: "`session-titles --version`"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS, how you installed it, and the mode
      placeholder: macOS 26.1, plugin, fresh / Ubuntu 26.04, install.sh, fast
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`session-titles doctor --no-model` output"
      render: text
  - type: textarea
    id: log
    attributes:
      label: "`session-titles log -n 20 <session>` output (redacted)"
      description: Replace origins and focus text with placeholders if they're sensitive.
      render: text
