<meta charset="utf-8">
<title>/*QW_TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one decision card centred under a slim progress bar; cards slide in from the right, out to the left. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3; --fg:#17212B; --muted:#5C6977; --line:#D7DEE6;
  --accent:#1D5C8A; --accent-ink:#FFFFFF; --accent-soft:#E2EDF7;
  --yes:#17714A; --yes-soft:#E3F4EB; --no:#A53D34; --no-soft:#F8E6E3; --discuss:#8C5A0F; --discuss-soft:#FBEFDA;
  --p1:#B5473E; --p2:#1D5C8A; --p3:#6B7785;
  --shadow:0 10px 30px rgba(23,33,43,.08);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#172029; --surface-2:#1F2A35; --fg:#E7ECF1; --muted:#98A5B3; --line:#2A3642;
  --accent:#6FB1E0; --accent-ink:#0E151C; --accent-soft:#17304A;
  --yes:#4CC38A; --yes-soft:#163227; --no:#E27F74; --no-soft:#3A2220; --discuss:#E2A94E; --discuss-soft:#3A2D16;
  --p1:#E27F74; --p2:#6FB1E0; --p3:#98A5B3; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#172029; --surface-2:#1F2A35; --fg:#E7ECF1; --muted:#98A5B3; --line:#2A3642;
  --accent:#6FB1E0; --accent-ink:#0E151C; --accent-soft:#17304A;
  --yes:#4CC38A; --yes-soft:#163227; --no:#E27F74; --no-soft:#3A2220; --discuss:#E2A94E; --discuss-soft:#3A2D16;
  --p1:#E27F74; --p2:#6FB1E0; --p3:#98A5B3; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .7s cubic-bezier(.34,1.5,.64,1);will-change:transform}
.barrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);letter-spacing:.01em}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip.done{border-color:var(--yes);color:var(--yes)}
.save{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.barend{display:inline-flex;align-items:center;gap:10px;flex:none}
.snd{flex:none;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;cursor:pointer}
.snd:hover{color:var(--fg)} .snd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.snd svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd .spk{fill:currentColor}.snd .off{display:none}.snd.muted .wav{display:none}.snd.muted .off{display:inline}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.save.ok .dot{background:var(--yes)}
.save.busy .dot{background:var(--discuss);animation:pulse 1s infinite}
.save.local .dot{background:var(--muted)}
@keyframes pulse{50%{opacity:.3}}

main{flex:1;display:flex;justify-content:center;align-items:flex-start;position:relative;max-width:760px;width:100%;margin:0 auto;padding-block:8px 0}
.screen{width:100%;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:28px clamp(18px,4vw,36px) 26px;animation:enter .42s cubic-bezier(.2,.9,.25,1.05) both;transform-origin:50% 100%}
.screen.leaving{position:absolute;inset:8px 0 auto 0;animation:leave .28s cubic-bezier(.4,0,.8,.4) both;pointer-events:none}
.screen.leaving.back{animation-name:leaveBack}
@keyframes enter{from{opacity:0;transform:translateX(44px) rotate(1.6deg)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateX(-56px) rotate(-2.4deg) scale(.97)}}
@keyframes leaveBack{to{opacity:0;transform:translateX(56px) rotate(2.4deg) scale(.97)}}
.screen.back{animation-name:enterBack}
@keyframes enterBack{from{opacity:0;transform:translateX(-44px) rotate(-1.6deg)}to{opacity:1;transform:none}}

.eyebrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.prio{font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;color:#fff;background:var(--p3)}
.prio.p1{background:var(--p1)} .prio.p2{background:var(--p2)}
.tick{font-family:var(--mono);font-size:12.5px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
h2{font-size:clamp(21px,3.6vw,27px);line-height:1.22}
.lead{color:var(--muted);margin:10px 0 0;max-width:62ch}

.figure{margin:18px 0 6px;padding:16px 18px;border-radius:14px;background:var(--surface-2);display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.figure svg{width:100%;height:auto;display:block;max-width:100%}
.figure figcaption{font-size:14px;color:var(--fg);margin:0}
.figure figcaption .lbl{display:inline-block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:8px}
.figure .ph{font-size:12.5px;color:var(--discuss);font-weight:600}
.figure .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.figure .hub{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.figure .hub:hover{border-color:var(--accent)}
.figure .hub:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar-grow rect.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.screen.ready .bar-grow rect.g{transform:none}
.bar-grow text{font-family:var(--mono);font-size:14px;fill:var(--fg)}
.bar-grow text.l{font-family:var(--body);fill:var(--muted)}
.dots circle{opacity:0;transition:opacity .3s}
.screen.ready .dots circle{opacity:1}
.ico{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .soft{fill:var(--accent-soft);stroke:none}
.ico .warn{stroke:var(--discuss)}
.ico .bad{stroke:var(--no)}
.ico text{font-family:var(--body);font-size:13px;fill:var(--fg);stroke:none}

.ask{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.opts.n3,.opts.n4{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;transition:border-color .2s,transform .18s cubic-bezier(.3,1.4,.5,1),background .2s,box-shadow .2s;animation:pop .36s cubic-bezier(.2,.8,.2,1) backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (hover:hover){.opt:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(23,33,43,.10)}}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .head{display:flex;align-items:center;gap:8px}
.opt .key{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:18px}
.opt .name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.opt .sub{font-size:14px;color:var(--fg)}
.opt .impl{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.opt .impl b{color:var(--fg);font-weight:600}
.opt .rec{position:absolute;top:-10px;right:12px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:999px}
.opt.yes .name{color:var(--yes)} .opt.no .name{color:var(--no)} .opt.discuss .name{color:var(--discuss)}
.opt.sel.yes{border-color:var(--yes);background:var(--yes-soft)} .opt.sel.no{border-color:var(--no);background:var(--no-soft)} .opt.sel.discuss{border-color:var(--discuss);background:var(--discuss-soft)}
.opt .mark{margin-left:auto;width:22px;height:22px;flex:none}
.opt .mark circle{fill:none;stroke:var(--line);stroke-width:2}
.opt .mark path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s ease}
.opt.sel .mark circle{stroke:currentColor}
.opt.sel .mark path{stroke-dashoffset:0}
.opt.sel.yes .mark{color:var(--yes)} .opt.sel.no .mark{color:var(--no)} .opt.sel.discuss .mark{color:var(--discuss)}

.extra{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.extra label{font-size:13px;color:var(--muted)}
.extra input,.extra textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.extra input:focus,.extra textarea:focus{outline:none;border-color:var(--accent)}
.extra textarea{min-height:64px;resize:vertical}
.extra .num{max-width:180px}
.notebtn{align-self:flex-start;background:none;border:none;color:var(--accent);padding:0;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
[tabindex="-1"]:focus{outline:none}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* opening */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0 6px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{border-radius:14px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,46px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .what{font-size:14px;font-weight:600}
.stat .how{font-size:12.5px;color:var(--muted)}
.stat.you{background:var(--accent-soft);grid-column:1/-1}
@media (min-width:560px){.stat.you{grid-column:auto}}
.stat.you .big{color:var(--accent)}
.split{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex;margin:14px 0 6px}
.split{transform:scaleX(0);transform-origin:left center;transition:transform 1s cubic-bezier(.2,.8,.2,1) .2s}
.screen.ready .split{transform:none}
.split i{display:block;height:100%;background:var(--yes);width:var(--w)}
.split i.you{background:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend b{color:var(--fg)}
.hl{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:640px){.hl{grid-template-columns:1fr 1fr}}
.hl li{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--surface-2);display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:pop .45s cubic-bezier(.2,.8,.2,1) forwards}
.hl li b{font-weight:600}
.hl li .ok{flex:none;width:18px;height:18px;border-radius:50%;background:var(--yes);color:#fff;display:grid;place-items:center;font-size:11px;margin-top:2px}
.hl li .mv{background:var(--p3)}
.whyline{font-size:14px;color:var(--muted);margin:16px 0 0}

/* summary */
.sum{margin-top:16px;display:flex;flex-direction:column;gap:18px}
.sum h3{font-family:var(--display);font-size:16px;margin:0 0 8px;letter-spacing:-.01em;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.sum table{width:100%;border-collapse:collapse;font-size:14px}
.sum td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.sum td:first-child{white-space:nowrap;font-family:var(--mono);font-size:12.5px;color:var(--muted);width:1%}
.sum td:nth-child(2){overflow-wrap:break-word}
.sum td:last-child{text-align:right;width:1%;min-width:5.5em;max-width:42vw}
.sum .pill{white-space:nowrap}
@media (max-width:559px){.sum td:first-child{white-space:normal;overflow-wrap:break-word;min-width:5.5em;max-width:7.5em}.sum td:last-child{max-width:38vw}.sum .pill{white-space:normal;text-align:left;overflow-wrap:break-word;border-radius:10px}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.yes{background:var(--yes-soft);color:var(--yes)} .pill.no{background:var(--no-soft);color:var(--no)} .pill.discuss{background:var(--discuss-soft);color:var(--discuss)}
.sum .note{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.sum .jump{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.copybox{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);color:var(--fg);resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
  .bar-grow rect.g{transform:none}
  .confetti,.snd{display:none}
}
/* the same, switched on by <html data-motion="reduce"> (a test toggle: add #reduce-motion to the URL) */
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before,:root[data-motion="reduce"] *::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
:root[data-motion="reduce"] .bar-grow rect.g{transform:none}
:root[data-motion="reduce"] .confetti,:root[data-motion="reduce"] .snd{display:none}
/* walkthrough additions */
textarea::placeholder,input::placeholder{color:var(--muted);opacity:1}
.badge{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:var(--discuss-soft);color:var(--discuss)}
.recline{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:15px;max-width:68ch}
.recline b{color:var(--accent)}
.today{margin:10px 0 0;font-size:14.5px;max-width:68ch}
.today .lbl,.ask-lbl{display:inline-block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:8px}
.figure .two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.figure .two.side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.figure .ex{display:block;margin-top:4px}
.ask{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 12px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--fg)}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.free label{font-size:13px;color:var(--muted)}
.ico .ok{stroke:var(--yes)}
.ico .nofill{fill:var(--no-soft);stroke:var(--no)}
.ico .big{font-family:var(--display);font-weight:700;font-size:15px}
.ico .sm{font-size:12px;fill:var(--muted)}
.ico .redt{fill:var(--no)} .ico .greent{fill:var(--yes)} .ico .acct{fill:var(--accent)}
.cards7{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:640px){.cards7{grid-template-columns:1fr 1fr}}
.cards7 li{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--surface-2);display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:pop .45s cubic-bezier(.2,.8,.2,1) forwards}
.cards7 li .n{flex:none;font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:20px;background:var(--surface)}
.cards7 li b{font-weight:600}
.cards7 li.done .n{background:var(--yes);color:#fff;border-color:var(--yes)}
/* card 3 part 2 + card 8 unit toggles */
.partsep{display:flex;align-items:center;gap:10px;margin:34px 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.partsep::before,.partsep::after{content:"";flex:1;border-top:1px solid var(--line)}
.units{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.units details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.units summary{cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;list-style:none}
.units summary::-webkit-details-marker{display:none}
.units summary .cnt{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.units summary .cnt.on{color:var(--yes);font-weight:600}
.units summary::before{content:"▸";color:var(--muted);margin-right:-4px}
.units details[open] summary::before{content:"▾"}
.units summary>span:first-of-type{flex:1}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.urow .m{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.urow .z{color:var(--muted);font-size:12.5px;white-space:nowrap}
.urow input.sw{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.urow input.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.urow input.sw:checked{background:var(--yes)}
.urow input.sw:checked::after{transform:translateX(16px)}
.urow input.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.units .uhint{font-size:12.5px;color:var(--muted)}
/* question-walkthrough: generic visuals (HTML where text must wrap, SVG for bars) */
button.chip{cursor:pointer;font-family:inherit;line-height:inherit}
.cards7 li[data-go]{cursor:pointer}
.cards7 li[data-go]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.uhint.warn{color:var(--no);font-weight:600}
.checks .z{color:var(--muted);font-size:12.5px}
.qv-split-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface)}
.qv-split-bar{transform:scaleX(0);transform-origin:left center;transition:transform .9s cubic-bezier(.2,.8,.2,1) .15s}
.screen.ready .qv-split-bar{transform:none}
.qv-split-bar i{display:block;width:var(--w)}
.qv-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.qv-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.qv-legend b{color:var(--fg)}
.qv-flow,.qv-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.qv-flow li{position:relative;padding:9px 12px;border-radius:10px;background:var(--surface);border-left:4px solid var(--accent);font-size:14px;margin-bottom:22px}
.qv-flow li:last-child{margin-bottom:0}
.qv-flow li:not(:last-child)::after{content:"↓";position:absolute;left:18px;bottom:-21px;color:var(--muted);font-size:14px;line-height:20px}
.qv-flow li span,.qv-steps li span:not(.num){display:block;color:var(--muted);font-size:13px}
.qv-steps li{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;padding:6px 0 6px 14px;border-left:3px solid var(--accent);font-size:14px}
.qv-steps li .num{grid-row:span 2;font-size:12px;color:var(--muted);min-width:4.5em}
.qv-steps li span:not(.num){grid-column:2}
.t-yes{border-color:var(--yes)!important} .t-no{border-color:var(--no)!important} .t-discuss{border-color:var(--discuss)!important} .t-muted{border-color:var(--p3)!important}
.qv-tree{font-size:14px}
.qv-tree ul{list-style:none;margin:6px 0 0 10px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.qv-tree li{margin:8px 0}
.qv-ask{display:inline-block;padding:7px 11px;border-radius:10px;background:var(--surface);border:1.5px solid var(--accent);font-weight:600}
.qv-br{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 8px 4px 0}
.qv-leaf{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--surface);border-left:4px solid var(--accent)}
.qv-ba{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:stretch}
@media (min-width:560px){.qv-ba{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}}
.qv-col{padding:10px 12px;border-radius:12px;background:var(--surface)}
.qv-col.after{border:1.5px solid var(--yes)}
.qv-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.qv-col ul{margin:0;padding-left:18px;font-size:14px}
.qv-col li.t-no{color:var(--no)} .qv-col li.t-yes{color:var(--yes)}
.qv-arrow{align-self:center;justify-self:center;color:var(--muted);font-size:20px}
@media (max-width:559px){.qv-arrow{transform:rotate(90deg)}}
.qv-table{overflow-x:auto}
.qv-table table{border-collapse:collapse;width:100%;font-size:13.5px}
.qv-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
.qv-table td{padding:6px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.qv-table tr.hl-row td{background:var(--accent-soft);font-weight:600}
.qv-img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.nosave{max-width:760px;width:100%;margin:12px auto 0;border:2px solid var(--no);background:var(--no-soft);color:var(--fg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.nosave[hidden]{display:none}
.bar[hidden]{display:none}
.nosave b{color:var(--no)}
.nosave p{margin:0;font-size:15px;line-height:1.45}
.nosave .btn{align-self:flex-start;background:var(--no);border-color:var(--no);color:var(--surface)}
.copyrow{margin:10px 0 0;text-align:right}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
/* v0.2.0 motion: transform and opacity only, nothing blocks a tap (the next pick works at once) */
.track.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scaleY(1.9)}}
.opt.just .mark{animation:checkpop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes checkpop{0%{transform:scale(.6)}55%{transform:scale(1.3)}100%{transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.milestone{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:25;pointer-events:none;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);opacity:0;transform:translate(-50%,-12px) scale(.9);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.milestone.done{background:var(--yes);color:var(--surface)}
.milestone.show{opacity:1;transform:translate(-50%,0)}
.qv-flow li,.qv-steps li,.qv-tree li,.qv-table tbody tr{opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1.2);transition-delay:calc(.15s + min(var(--i,0),10) * .11s)}
.qv-tree li{transform:translateX(-10px)}
.qv-table tbody tr{transform:none}
.screen.ready .qv-flow li,.screen.ready .qv-steps li,.screen.ready .qv-tree li,.screen.ready .qv-table tbody tr{opacity:1;transform:none}
.qv-col{transition:opacity .4s ease .1s,transform .5s cubic-bezier(.2,.9,.3,1.1) .1s;opacity:0}
.qv-col.before{transform:translateX(-24px)} .qv-col.after{transform:translateX(24px);transition-delay:.3s}
.qv-arrow{opacity:0;transition:opacity .3s ease .5s}
.qv-col li{opacity:0;transition:opacity .3s ease;transition-delay:calc(.45s + min(var(--i,0),8) * .08s)}
.qv-col.after li{transition-delay:calc(.65s + min(var(--i,0),8) * .08s)}
.screen.ready .qv-col,.screen.ready .qv-col li,.screen.ready .qv-arrow{opacity:1}
.screen.ready .qv-col{transform:none}
.qv-img,.figure>svg.ico,.figure>.two{animation:fadeup .5s cubic-bezier(.2,.8,.2,1) .1s backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
.sum tr{animation:rowin .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.2s + var(--i,0) * .045s)}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}}
.sum.all h3{animation:fadeup .4s ease backwards}
.donecheck{display:inline-block;width:.9em;height:.9em;vertical-align:-.08em;margin-right:.3em;color:var(--yes);animation:checkpop .6s cubic-bezier(.3,1.7,.5,1) .15s backwards}
.donecheck svg{width:100%;height:100%;display:block}
.donecheck circle{fill:var(--yes-soft);stroke:currentColor;stroke-width:2}
.donecheck path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:draw .45s ease .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
