name: test

on:
  push:
  pull_request:
  workflow_call:   # the release workflow runs the same matrix first

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # uv ships its own Python builds, so 3.9 keeps working after runner images drop it
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --python ${{ matrix.python }} python -X dev -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run --no-project --python ${{ matrix.python }} python scripts/demo.py
      - run: uvx pyflakes scripts tests
      - run: sh -n install.sh && sh -n bin/session-titles
      - name: manifests are valid JSON
        run: python3 -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'hooks/hooks.json', 'examples/settings-snippet.json')]"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
